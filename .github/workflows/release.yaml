name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_mac: ${{ steps.get_version.outputs.version_mac }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Extract and verify versions
      id: get_version
      run: |
        # Validate pyproject.toml syntax first
        echo "Validating pyproject.toml syntax..."
        python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))" || {
          echo "ERROR: pyproject.toml has syntax errors"
          exit 1
        }
        echo "✓ pyproject.toml syntax valid"
        
        # Get version from pyproject.toml
        PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "pyproject.toml version: $PYPROJECT_VERSION"
        
        # Get versions from __version__.py
        VERSION_PY=$(python -c "exec(open('__version__.py').read()); print(__version__)")
        VERSION_MAC_PY=$(python -c "exec(open('__version__.py').read()); print(__version_mac__)")
        echo "__version__.py version: $VERSION_PY"
        echo "__version__.py mac version: $VERSION_MAC_PY"
        
        # Get git tag (remove 'v' prefix)
        GIT_TAG=${GITHUB_REF#refs/tags/v}
        echo "Git tag version: $GIT_TAG"
        
        # Verify all versions match
        if [ "$PYPROJECT_VERSION" != "$VERSION_PY" ]; then
          echo "ERROR: Version mismatch between pyproject.toml ($PYPROJECT_VERSION) and __version__.py ($VERSION_PY)"
          exit 1
        fi
        
        if [ "$PYPROJECT_VERSION" != "$GIT_TAG" ]; then
          echo "ERROR: Version mismatch between pyproject.toml ($PYPROJECT_VERSION) and git tag ($GIT_TAG)"
          exit 1
        fi
        
        echo "✓ All versions match: $PYPROJECT_VERSION"
        echo "version=$PYPROJECT_VERSION" >> $GITHUB_OUTPUT
        echo "version_mac=$VERSION_MAC_PY" >> $GITHUB_OUTPUT

  build-macos:
    needs: verify-version
    strategy:
      matrix:
        include:
          - runner: macos-13  # Intel runner
            arch: x86_64
            display_name: Intel
          - runner: macos-14  # Apple Silicon runner
            arch: arm64
            display_name: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
        # Install create-dmg (optional, will fallback to basic DMG if missing)
        brew install create-dmg || echo "Warning: create-dmg not installed, will use basic DMG creation"
    
    - name: Verify create-dmg installation
      run: |
        if command -v create-dmg &> /dev/null; then
          echo "create-dmg is installed"
          create-dmg --version || echo "create-dmg installed but version check failed"
        else
          echo "create-dmg not available - will use basic DMG creation method"
        fi
    
    - name: Verify architecture
      run: |
        echo "Expected arch: ${{ matrix.arch }}"
        echo "Actual arch: $(uname -m)"
        if [ "$(uname -m)" != "${{ matrix.arch }}" ]; then
          echo "ERROR: Architecture mismatch!"
          exit 1
        fi
    
    - name: Build Mac app
      run: |
        set -x  # Enable command echoing for debugging
        python build_macos.py
    
    - name: Verify app bundle was created
      run: |
        if [ ! -d "dist/PatchBatch.app" ]; then
          echo "ERROR: dist/PatchBatch.app not found"
          ls -la dist/ || echo "dist/ directory doesn't exist"
          exit 1
        fi
        echo "✓ App bundle exists: dist/PatchBatch.app"
        ls -lh dist/PatchBatch.app
    
    - name: Verify DMG was created
      run: |
        if [ ! -f "dist/PatchBatch-macOS.dmg" ]; then
          echo "ERROR: dist/PatchBatch-macOS.dmg not found"
          ls -la dist/
          exit 1
        fi
        echo "✓ DMG exists: dist/PatchBatch-macOS.dmg"
        ls -lh dist/PatchBatch-macOS.dmg
    
    - name: Verify version in DMG
      run: |
        echo "Built version: ${{ needs.verify-version.outputs.version }}"
        # Mount DMG and check version info in app bundle
        hdiutil attach dist/PatchBatch-macOS.dmg -mountpoint /Volumes/PatchBatch
        APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Volumes/PatchBatch/PatchBatch.app/Contents/Info.plist)
        echo "App bundle version: $APP_VERSION"
        hdiutil detach /Volumes/PatchBatch
        if [ "$APP_VERSION" != "${{ needs.verify-version.outputs.version_mac }}" ]; then
          echo "ERROR: Version in app bundle doesn't match expected version"
          exit 1
        fi
        echo "✓ DMG version verified"
    
    - name: Rename DMG to include architecture
      run: |
        mv dist/PatchBatch-macOS.dmg "dist/PatchBatch-macOS-${{ matrix.display_name }}.dmg"
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg-${{ matrix.arch }}
        path: dist/PatchBatch-macOS-${{ matrix.display_name }}.dmg

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows exe
      run: python build_windows.py
    
    - name: Verify version in executable
      shell: powershell
      run: |
        $exePath = "dist\PatchBatch-Windows\PatchBatch.exe"
        if (Test-Path $exePath) {
          $versionInfo = (Get-Item $exePath).VersionInfo
          $fileVersion = $versionInfo.FileVersion
          $expectedVersion = "${{ needs.verify-version.outputs.version }}"
          Write-Host "Executable version: $fileVersion"
          Write-Host "Expected version: $expectedVersion"
          if (-not $fileVersion.StartsWith($expectedVersion)) {
            Write-Error "Version mismatch in Windows executable"
            exit 1
          }
          Write-Host "✓ Windows executable version verified"
        } else {
          Write-Error "Executable not found"
          exit 1
        }
    
    - name: Create Windows ZIP
      run: |
        Compress-Archive -Path "dist\PatchBatch-Windows\*" -DestinationPath "dist\PatchBatch-Windows.zip"
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-zip
        path: dist/PatchBatch-Windows.zip

  publish-pypi:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Verify package version
      run: |
        BUILT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "Package version: $BUILT_VERSION"
        if [ "$BUILT_VERSION" != "${{ needs.verify-version.outputs.version }}" ]; then
          echo "ERROR: Built package version doesn't match verified version"
          exit 1
        fi
        echo "✓ Package version verified"
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/*.tar.gz dist/*.whl

  release:
    needs: [verify-version, build-macos, build-windows, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Arrange files for release
      run: |
        ls -R
        # Copy macOS DMGs with user-friendly names
        cp macos-dmg-arm64/PatchBatch-macOS-AppleSilicon.dmg PatchBatch-macOS-AppleSilicon.dmg
        cp macos-dmg-x86_64/PatchBatch-macOS-Intel.dmg PatchBatch-macOS-Intel.dmg
        # Copy Windows zip
        cp windows-zip/PatchBatch-Windows.zip PatchBatch-Windows.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PatchBatch-macOS-AppleSilicon.dmg
          PatchBatch-macOS-Intel.dmg
          PatchBatch-Windows.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## PatchBatch v${{ needs.verify-version.outputs.version }}
          
          ### Installation
          
          #### macOS
          **Choose the correct version for your Mac:**
          - **Apple Silicon (M1/M2/M3/M4):** Download `PatchBatch-macOS-AppleSilicon.dmg`
          - **Intel Macs:** Download `PatchBatch-macOS-Intel.dmg`
          
          After downloading:
          1. Double-click the DMG to mount it
          2. Drag PatchBatch.app to your Applications folder
          3. First run: Right-click → Open (to bypass Gatekeeper security)
          
          #### Windows
          1. Download `PatchBatch-Windows.zip`
          2. Extract to your desired location
          3. Run `PatchBatch.exe`
          
          #### Python (PyPI)
          This version is also available via pip:
          ```bash
          pip install patchbatch==${{ needs.verify-version.outputs.version }}
          patchbatch
          ```
          
          ---
          
          See the [README](https://github.com/ck852/patchbatch#readme) for detailed usage instructions.