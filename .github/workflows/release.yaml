name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg || true
      
      - name: Build Mac app
        run: python build_macos.py
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/PatchBatch-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows exe
      run: python build_windows.py
    
    - name: Create Windows ZIP
      run: |
        Compress-Archive -Path "dist\PatchBatch-Windows\*" -DestinationPath "dist\PatchBatch-Windows.zip"
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-zip
        path: dist/PatchBatch-Windows.zip

  publish-pypi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/*.tar.gz dist/*.whl

  release:
    needs: [build-macos, build-windows, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Arrange files for release
      run: |
        ls -R
        cp macos-dmg/PatchBatch-macOS.dmg PatchBatch-macOS.dmg
        cp windows-zip/PatchBatch-Windows.zip PatchBatch-Windows.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PatchBatch-macOS.dmg
          PatchBatch-Windows.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Installation
          
          ### macOS
          - **Apple Silicon (M1/M2/M3/M4):** Download `PatchBatch-macOS-AppleSilicon.dmg`
          
          After downloading:
          1. Double-click the DMG to mount it
          2. Drag PatchBatch.app to your Applications folder
          3. First run: Right-click → Open (to bypass Gatekeeper security)
          
          ### Windows
          1. Download `PatchBatch-Windows.zip`
          2. Extract to your desired location
          3. Run `PatchBatch.exe`
          
          ### Python (PyPI)
          This version is also available via pip:
          ```bash
          pip install patchbatch
          patchbatch
          ```
          
          ---
          
          See the [README](https://github.com/ck852/patchbatch#readme) for detailed usage instructions.